<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>一先生ポータル</title>
  <meta name="theme-color" content="#1a3a5c">
  <!-- iPhone：ホーム画面から開いたときにアプリのように全画面で表示 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="一先生">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #f7f5f0; }
    body { padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); box-sizing: border-box; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: linear-gradient(135deg, #1a3a5c, #5c1e34); color: #fff;
      font-family: "Hiragino Mincho ProN", "Noto Serif JP", serif; transition: opacity .4s;
    }
    #loading img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
    #loading .dot { width: 8px; height: 8px; border-radius: 50%; background: #e8d6be; display: inline-block; margin: 0 4px; animation: b 1s infinite alternate; }
    #loading .dot:nth-child(2) { animation-delay: .2s; } #loading .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes b { to { opacity: .2; transform: translateY(-4px); } }
    #loading.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icon-192.png" alt="">
    <div>一先生ポータル</div>
    <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </div>
  <iframe id="app" title="一先生ポータル" allow="clipboard-write"></iframe>
  <script>
    // 本体（Google Apps Script のウェブアプリ）のURL
    var APP_URL = 'https://script.google.com/macros/s/AKfycbzaszKilV1E-O9l8UOxnKmcBXsWLnGQBojXi4VMWdAYRuWjHpCbYVDo2Crlyn3DOEXK/exec';
    // このページのURLの後ろ（?teacher や ?key=… など）をそのまま本体に渡す
    var frame = document.getElementById('app');
    frame.src = APP_URL + location.search;
    frame.addEventListener('load', function () {
      document.getElementById('loading').classList.add('hide');
    });
    setTimeout(function () { document.getElementById('loading').classList.add('hide'); }, 8000);
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  </script>
</body>
</html>
