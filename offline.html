<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>オフライン｜一先生ポータル</title>
  <meta name="theme-color" content="#1a3a5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100vh; min-height: 100dvh; box-sizing: border-box;
      padding: calc(env(safe-area-inset-top) + 24px) calc(env(safe-area-inset-right) + 24px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 24px);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center;
      background: linear-gradient(135deg, #1a3a5c, #5c1e34); color: #fff;
      font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    }
    img { width: 88px; height: 88px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
    h1 { margin: 8px 0 0; font: 600 20px/1.4 "Hiragino Mincho ProN", "Noto Serif JP", serif; }
    p { margin: 0; max-width: 22em; font-size: 15px; line-height: 1.7; opacity: .9; }
    .en { font-size: 13px; opacity: .7; }
    button {
      margin-top: 8px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px;
      background: #e8d6be; color: #1a3a5c; font: 600 16px system-ui, sans-serif; cursor: pointer;
    }
  </style>
</head>
<body>
  <img src="icon-192.png" alt="">
  <h1>インターネットに接続されていません</h1>
  <p>一先生ポータルの学習データはオンラインで読み込みます。通信できる場所でもう一度開いてください。</p>
  <p class="en">You're offline. Please reconnect and try again.</p>
  <button id="retry" type="button">もう一度読み込む / Retry</button>
  <script>
    function go() { location.replace('./' + location.search); }
    document.getElementById('retry').addEventListener('click', go);
    window.addEventListener('online', go);
  </script>
</body>
</html>
